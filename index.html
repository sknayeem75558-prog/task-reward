<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskEarn</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script defer src="app.js"></script>
</head>
<body>
<header><h1>TaskEarn</h1><a href="admin.html">Admin</a></header>
<main>
<section id="authSection" class="card">
<h2>Register</h2>
<input id="regEmail" type="email" placeholder="Email"><input id="regPassword" type="password" placeholder="Password">
<button onclick="register()">Create Account</button><hr>
<h2>Login</h2>
<input id="loginEmail" type="email" placeholder="Email"><input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Login</button><div id="message" class="message"></div>
</section>
<section id="appSection" style="display:none">
<div class="card"><h2>My Balance</h2><div class="points"><span id="points">0</span> Points</div><button onclick="logout()">Logout</button></div>
<div class="card"><h2>Available Tasks</h2><div id="tasks"></div></div>
<div class="card"><h2>My Submissions</h2><div id="submissions"></div></div>
<div class="card"><h2>Request Reward</h2><input id="rewardPoints" type="number" placeholder="Points"><input id="rewardMethod" placeholder="Method"><input id="rewardAccount" placeholder="Account"><button onclick="requestReward()">Request Reward</button></div>
</section>
</main></body></html>
